{% capture logo_path %}{{ site.logo }}{% endcapture %}

<div class="masthead">
    <div class="masthead__inner-wrap">
        <div class="masthead__menu">
            <nav id="site-nav" class="greedy-nav">
                {% unless logo_path == empty %}
                <a class="site-logo" href="{{ '/' | relative_url }}"
                    ><img
                        src="{{ logo_path | relative_url }}"
                        alt="{{ site.masthead_title | default: site.title }}"
                /></a>
                {% endunless %}
                <a class="site-title" href="{{ '/' | relative_url }}">
                    {{ site.masthead_title | default: site.title }} {% if
                    site.subtitle %}<span class="site-subtitle"
                        >{{ site.subtitle }}</span
                    >{% endif %}
                </a>
                <ul class="visible-links">
                    <!-- {%- for link in site.data.navigation.main -%}
                    <li class="masthead__menu-item">
                        <a
                            href="{{ link.url | relative_url }}"
                            {%
                            if
                            link.description
                            %}
                            title="{{ link.description }}"
                            {%
                            endif
                            %}
                            {%
                            if
                            link.target
                            %}
                            target="{{ link.target }}"
                            {%
                            endif
                            %}
                            >{{ link.title }}</a
                        >
                    </li>
                    {%- endfor -%} -->
                    <li class="masthead__menu-item">
                        <button
                            id="toggle-theme"
                            class="theme-toggle"
                            type="button"
                            aria-label="Toggle dark mode"
                            title="Toggle dark mode"
                            aria-pressed="false"
                        >
                            <span class="visually-hidden">Toggle dark mode</span>
                        </button>
                    </li>
                    <li class="masthead__menu-item">
                        <a href="/about/" aria-label="About" title="About"
                            ><i class="fa-solid fa-fw fa-address-card"></i
                        ></a>
                    </li>
                    <li class="masthead__menu-item">
                        <a
                            href="https://github.com/devbattery"
                            aria-label="GitHub"
                            title="GitHub"
                            ><i class="fa-brands fa-fw fa-github"></i
                        ></a>
                    </li>
                    <li class="masthead__menu-item">
                        <a href="/tags/" aria-label="Tags" title="Tags"
                            ><i class="fa-solid fa-fw fa-tags"></i
                        ></a>
                    </li>
                </ul>
                {% if site.search == true %}
                <button class="search__toggle" type="button">
                    <span class="visually-hidden"
                        >{{ site.data.ui-text[site.locale].search_label |
                        default: "Toggle search" }}</span
                    >
                    <i class="fas fa-fw fa-search"></i>
                </button>
                {% endif %}
                <button class="greedy-nav__toggle hidden" type="button">
                    <span class="visually-hidden"
                        >{{ site.data.ui-text[site.locale].menu_label | default:
                        "Toggle menu" }}</span
                    >
                    <div class="navicon"></div>
                </button>
                <ul class="hidden-links hidden"></ul>
            </nav>
        </div>
    </div>
</div>
