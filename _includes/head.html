<meta charset="utf-8" />

{% if page.use_math %} {% include mathjax_support.html %} {% endif %} {% include
seo.html %} {% unless site.atom_feed.hide %}
<link
  href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}"
  type="application/atom+xml"
  rel="alternate"
  title="{{ site.title }} Feed"
/>
{% endunless %}

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />

<script>
  (function () {
    var root = document.documentElement;
    var storedTheme = null;
    var prefersDarkMode = false;

    try {
      storedTheme = localStorage.getItem("theme");
    } catch (error) {
      storedTheme = null;
    }

    if (window.matchMedia) {
      prefersDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    var isDarkMode =
      storedTheme === "dark" || (storedTheme !== "default" && prefersDarkMode);

    root.className = root.className.replace(/\bno-js\b/g, "") + " js ";
    root.setAttribute("data-theme", isDarkMode ? "dark" : "default");
  })();
</script>

<!-- For all browsers -->
<link
  id="theme-default-css"
  rel="stylesheet"
  href="{{ '/assets/css/main.css' | relative_url }}"
/>
<link
  id="theme-dark-css"
  rel="stylesheet"
  href="{{ '/assets/css/main_dark.css' | relative_url }}"
/>
<script>
  (function () {
    var isDarkMode = document.documentElement.getAttribute("data-theme") === "dark";
    var defaultTheme = document.getElementById("theme-default-css");
    var darkTheme = document.getElementById("theme-dark-css");

    if (!defaultTheme || !darkTheme) {
      return;
    }

    defaultTheme.disabled = isDarkMode;
    darkTheme.disabled = !isDarkMode;
  })();
</script>

<link
  rel="preload"
  href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
  as="style"
  onload="this.onload=null;this.rel='stylesheet'"
/>
<noscript
  ><link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
/></noscript>

{% if site.head_scripts %} {% for script in site.head_scripts %}
<script src="{{ script | relative_url }}"></script>
{% endfor %} {% endif %}
