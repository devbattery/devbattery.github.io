name: Publish Post From Issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'post') || contains(github.event.issue.body, '### 본문')
    runs-on: ubuntu-latest
    concurrency:
      group: issue-post-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Build markdown from issue form
        id: write_post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const issue = context.payload.issue;
            const body = issue.body || "";
            const postsDir = "_posts";
            const issueNumber = issue.number;

            function escapeRegex(input) {
              return input.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function getField(label) {
              const re = new RegExp(
                `###\\s*${escapeRegex(label)}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s|$)`
              );
              const match = body.match(re);
              if (!match) {
                return "";
              }

              const value = match[1].trim();
              if (/^_No response_$/i.test(value)) {
                return "";
              }

              return value;
            }

            function listFromComma(input) {
              return input
                .split(",")
                .map((item) => item.trim())
                .filter(Boolean);
            }

            function quoteYaml(input) {
              return `'${String(input).replace(/'/g, "''")}'`;
            }

            function normalizeSlug(raw) {
              return String(raw || "")
                .trim()
                .toLowerCase()
                .normalize("NFKD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9가-힣\s_-]/g, "")
                .replace(/[\s_]+/g, "-")
                .replace(/-+/g, "-")
                .replace(/^-|-$/g, "");
            }

            function resolveSlug(raw, fallback) {
              const slugFromInput = normalizeSlug(raw);
              if (slugFromInput) {
                return slugFromInput;
              }

              const slugFromFallback = normalizeSlug(fallback);
              if (slugFromFallback) {
                return slugFromFallback;
              }

              return `post-${issueNumber}`;
            }

            function formatDate(input) {
              return new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
              }).format(input);
            }

            function resolveDate(raw, fallback, fieldName) {
              const value = (raw || "").trim();
              if (!value) {
                return fallback;
              }

              const isValidFormat = /^\d{4}-\d{2}-\d{2}$/.test(value);
              const parsed = new Date(`${value}T00:00:00+09:00`);
              const isValidDate = !Number.isNaN(parsed.getTime());

              if (!isValidFormat || !isValidDate) {
                core.warning(`${fieldName} 형식이 올바르지 않아 기본값을 사용합니다: ${value}`);
                return fallback;
              }

              return value;
            }

            function sanitizeFolder(raw) {
              const value = (raw || "").trim();
              if (!value) {
                return "";
              }

              const normalized = value.replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
              if (!normalized) {
                return "";
              }

              const segments = normalized.split("/").map((segment) => segment.trim()).filter(Boolean);
              for (const segment of segments) {
                if (segment === "." || segment === "..") {
                  throw new Error("저장 폴더에 . 또는 .. 경로는 사용할 수 없습니다.");
                }
                if (!/^[a-zA-Z0-9._-]+$/.test(segment)) {
                  throw new Error(`저장 폴더 형식이 올바르지 않습니다: ${segment}`);
                }
              }

              return segments.join("/");
            }

            function listMarkdownFiles(rootDir) {
              const files = [];
              const stack = [rootDir];

              while (stack.length > 0) {
                const currentDir = stack.pop();
                for (const entry of fs.readdirSync(currentDir, { withFileTypes: true })) {
                  const fullPath = path.join(currentDir, entry.name);
                  if (entry.isDirectory()) {
                    stack.push(fullPath);
                    continue;
                  }
                  if (entry.isFile() && entry.name.endsWith(".md")) {
                    files.push(fullPath);
                  }
                }
              }

              return files.sort();
            }

            function findExistingPostByIssueId() {
              const legacySuffix = `-issue-${issueNumber}.md`;
              const issueIdRegex = new RegExp(`^issue_id:\\s*${issueNumber}\\s*$`, "m");

              for (const filePath of listMarkdownFiles(postsDir)) {
                if (filePath.endsWith(legacySuffix)) {
                  return filePath;
                }

                const content = fs.readFileSync(filePath, "utf8");
                const frontMatterMatch = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
                if (!frontMatterMatch) {
                  continue;
                }
                if (issueIdRegex.test(frontMatterMatch[1])) {
                  return filePath;
                }
              }

              return "";
            }

            const categoryFolderMap = {
              til: "diary/til",
              baekjoon: "algorithms/baekjoon",
              hackerrank: "algorithms/hackerrank",
              leetcode: "algorithms/leetcode",
              programmers: "algorithms/programmers",
              codeforces: "algorithms/codeforces",
              inflearn: "algorithms/inflearn",
              recap: "algorithms/recap",
              network: "computing/network",
              "data-structure": "computing/data-structure",
              database: "computing/database",
              "operating-system": "computing/operating-system",
              project: "issue/project",
              spring: "programming/spring",
              java: "programming/java",
              devops: "programming/devops",
              react: "programming/react",
              vue: "programming/vue"
            };

            function resolveFolder(categories, folderInput) {
              const customFolder = sanitizeFolder(folderInput);
              if (customFolder) {
                return customFolder;
              }

              for (const category of categories) {
                const mapped = categoryFolderMap[category.toLowerCase()];
                if (mapped) {
                  return mapped;
                }
              }

              return "";
            }

            const titleFromIssue = issue.title.replace(/^\s*\[POST\]\s*/i, "").trim();
            const title = titleFromIssue || `Issue ${issue.number}`;

            const excerpt = getField("요약");
            const categories = listFromComma(getField("카테고리"));
            const fileSlugInput = getField("파일 슬러그");
            const folderInput = getField("저장 폴더");
            const tags = listFromComma(getField("태그"));
            const content = getField("본문").trim();
            const dateInput = getField("작성일");
            const lastModifiedInput = getField("수정일");

            if (!content) {
              core.setFailed("본문이 비어 있습니다.");
              return;
            }

            if (categories.length === 0) {
              categories.push("TIL");
            }

            const createdDate = resolveDate(
              dateInput,
              formatDate(new Date(issue.created_at)),
              "작성일"
            );
            const modifiedDate = resolveDate(
              lastModifiedInput,
              formatDate(new Date()),
              "수정일"
            );
            const slug = resolveSlug(fileSlugInput, title);
            const folder = resolveFolder(categories, folderInput);
            const fileName = `${createdDate}-${slug}.md`;
            const targetPath = folder
              ? path.join(postsDir, folder, fileName)
              : path.join(postsDir, fileName);
            const existingPath = findExistingPostByIssueId();

            const keepExistingPath = Boolean(existingPath) && !fileSlugInput && !folderInput;
            const filePath = keepExistingPath ? existingPath : targetPath;

            if (existingPath && existingPath !== filePath) {
              fs.mkdirSync(path.dirname(filePath), { recursive: true });
              fs.renameSync(existingPath, filePath);
            }

            fs.mkdirSync(path.dirname(filePath), { recursive: true });

            const lines = [];
            lines.push("---");
            lines.push(`title: ${quoteYaml(title)}`);
            if (excerpt) {
              lines.push(`excerpt: ${quoteYaml(excerpt)}`);
            }
            lines.push("");
            lines.push("categories:");
            for (const category of categories) {
              lines.push(`  - ${quoteYaml(category)}`);
            }
            if (tags.length > 0) {
              lines.push("tags:");
              for (const tag of tags) {
                lines.push(`  - ${quoteYaml(tag)}`);
              }
            } else {
              lines.push("tags: []");
            }
            lines.push("");
            lines.push("toc: true");
            lines.push("toc_sticky: true");
            lines.push("");
            lines.push("sidebar:");
            lines.push('  nav: "categories"');
            lines.push("");
            lines.push(`date: ${createdDate}`);
            lines.push(`last_modified_at: ${modifiedDate}`);
            lines.push(`issue_id: ${issueNumber}`);
            lines.push("---");
            lines.push("");
            lines.push(content);
            lines.push("");

            fs.writeFileSync(filePath, lines.join("\n"), "utf8");
            core.setOutput("path", filePath.split(path.sep).join("/"));

      - name: Commit and push
        id: commit
        env:
          POST_PATH: ${{ steps.write_post.outputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _posts
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No post changes to commit."
            exit 0
          fi
          git commit -m "chore(post): publish issue #${{ github.event.issue.number }}"
          git push origin release
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Comment issue with post path
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          POST_PATH: ${{ steps.write_post.outputs.path }}
        with:
          script: |
            const postPath = process.env.POST_PATH;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `포스트가 자동 반영되었습니다: \`${postPath}\``
            });
