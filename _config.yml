# Welcome to Jekyll!
# This config file sets up global settings for your site.

# Theme Settings
minimal_mistakes_skin: "default" # Options: "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale: "en-US"
title: "Dev Battery"
title_separator: "|"
subtitle: "Keep Your Dev Battery Charged"
name: "Wonjun Jeong"
description: "Keep Your Dev Battery Charged"
url: "https://devbattery.com"
baseurl: "" # the subpath of your site, e.g. "/blog"
repository: "devbattery/devbattery.github.io"
logo: "assets/images/nature.png"
words_per_minute: 200

# Comments Settings
comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOMFEzNA"
    category_name: "Comments"
    category_id: "DIC_kwDOMFEzNM4Cf380"
    theme: light

# Search Settings
search: true
search_full_content: true
search_provider: # Options: lunr, algolia, google
  # For lunr, ensure search_within_pages is enabled if needed:
  lunr:
    search_within_pages: false

# SEO Related
google_site_verification:
bing_site_verification:
naver_site_verification:
yandex_site_verification:
baidu_site_verification:

# Social Sharing & Profiles
twitter:
  username:
facebook:
  username:
  app_id:
  publisher:
og_image: # Open Graph/Twitter default site image
social:
  type: # Person or Organization
  name: # If different from site's name
  links: [] # Add your social media profile links as needed

# Analytics
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-WNRCKZVKTJ"

# Site Author
author:
  name: "Wonjun Jeong"
  avatar: "/assets/images/bio-photo.png"
  bio: "Backend Developer"
  location: "Korea Republic"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:devbattery@outlook.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/devbattery/"

# Site Footer
footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
    - label: "GitLab"
      icon: "fab fa-fw fa-gitlab"
    - label: "Bitbucket"
      icon: "fab fa-fw fa-bitbucket"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion & Markdown Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Seoul

# Pagination (using jekyll-paginate-v2)
pagination:
  enabled: true
  debug: false
  collection: "posts"
  per_page: 10
  permalink: "/page/:num/"
  title: ":title - page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  category: "posts"
  trail:
    before: 2
    after: 2

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: true
      share: false
      related: true
      show_date: true
      mathjax: true
      sidebar:
        nav: "categories"

date_format: "%Y-%m-%d"
after_footer_scripts:
  - /assets/js/dark-theme.js
  - /assets/js/clipboardrouge.js
  - https://cdn.jsdelivr.net/npm/clipboard@2/dist/clipboard.min.js

sitemap:
  path: sitemap.xml
